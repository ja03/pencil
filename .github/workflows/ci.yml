name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Steps run in order and stop at the first failure:
  # audit → lint → typecheck → unit and feature tests with coverage.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pencil
          POSTGRES_PASSWORD: pencil
          POSTGRES_DB: pencil_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pencil -d pencil_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Service containers can't take a command, so MinIO is started by hand.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=pencil -e MINIO_ROOT_PASSWORD=pencil-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      - name: Unit and feature tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

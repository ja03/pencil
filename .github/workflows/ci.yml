name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Steps run in order and stop at the first failure:
  # audit → lint → typecheck → unit and feature tests with coverage → E2E.
  # The deploy must wait for this job, so a failing E2E test blocks it.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pencil
          POSTGRES_PASSWORD: pencil
          POSTGRES_DB: pencil_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pencil -d pencil_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

      # Feature and E2E tests read the emails the app sends from Mailpit's API.
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Service containers can't take a command, so MinIO is started by hand.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=pencil -e MINIO_ROOT_PASSWORD=pencil-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      - name: Unit and feature tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # Builds the app, serves it on port 3100 against the same services, and
      # runs the core journeys in Chromium.
      - name: E2E tests
        run: npm run test:e2e

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Deploys the commit that just passed `check` to Render. Only pushes to main
  # get here, and only after every step of `check` (E2E included) is green.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Trigger the Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL isn't set, so nothing was deployed. See docs/deploy.md."
            exit 0
          fi
          # `ref` pins the deploy to this commit, not whatever main is by now.
          curl --fail-with-body --silent --show-error --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
